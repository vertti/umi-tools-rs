[tools]
rust = { version = "1.98.1", profile = "default" }
uv = "latest"
"aqua:sharkdp/hyperfine" = "latest"
hk = "latest"
pkl = "latest"


[tasks.fmt]
run = "cargo fmt --all -- --check"
description = "Check formatting"

[tasks.lint]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"
description = "Run clippy (strict)"

[tasks.test]
run = "cargo test --workspace"
description = "Run tests"

[tasks.check]
run = "cargo check --workspace --all-targets"
description = "Type check"

[tasks.build]
run = "cargo build --workspace"
description = "Build debug binary"

[tasks.ci]
depends = ["fmt", "check", "lint", "test"]
description = "Run all CI checks"

[tasks.compat]
run = "uv run --group test pytest tests/umi_tools_compat -v"
description = "Run umi-tools compatibility tests"
depends = ["build"]

[tasks.duplicates]
run = "uvx --from jscpd==5.2.1 jscpd --config .jscpd.json --baseline .jscpd-baseline.json --fail-on-new-clones=0 --fail-on-empty src crates"
description = "Reject new duplicated Rust blocks (existing clones are baselined)"

[tasks.golden]
run = "uv run --group bench python tests/golden/generate.py"
description = "Regenerate tests/golden references with Python umi_tools"

[tasks.bench-setup]
run = "bash benchmarks/setup.sh"
description = "Download benchmark data"

[tasks.bench]
run = "bash benchmarks/run.sh"
depends = ["bench-setup"]
description = "Run benchmarks (vs Python umi_tools)"
