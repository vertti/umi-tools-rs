[package]
name = "umi-core"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.98"
description = "Core library for umi-tools-rs — UMI extraction, deduplication, grouping, and counting"
license = "MIT"
repository = "https://github.com/vertti/umi-tools-rs"

[lints]
workspace = true

[dependencies]
needletail = { version = "0.7", default-features = false }
regex = "1"
rust-htslib = { version = "1", default-features = false, features = ["libdeflate"] }
thiserror = "2"
tempfile = "3.27.0"
