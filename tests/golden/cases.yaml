# Cases for flags the upstream test suite does not exercise. Same schema as
# upstream tests/tests.yaml. stdin names a file in tests/golden/inputs (made by
# inputs/make_inputs.py) or, failing that, in the upstream tests directory;
# <INPUTS> in options expands to tests/golden/inputs. References live here,
# gzipped, and are regenerated with tests/golden/generate.py.

dedup_spliced_is_unique:
  stdin: chr19_gene_tags.bam
  outputs: [stdout]
  references: [dedup_spliced_is_unique.sam.gz]
  options: dedup --out-sam --random-seed=123456789 --spliced-is-unique

