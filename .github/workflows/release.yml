name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test --workspace --locked
      - name: Check that both crates package and build at the tagged version
        run: |
          .github/scripts/set-release-version.sh
          cargo publish --workspace --dry-run --allow-dirty

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build
        run: RELEASE_VERSION="${GITHUB_REF_NAME#v}" cargo build --release --locked

      - name: Package
        run: |
          tar -czf umi-tools-rs-${{ matrix.target }}.tar.gz -C target/release umi-tools-rs
          shasum -a 256 umi-tools-rs-${{ matrix.target }}.tar.gz > umi-tools-rs-${{ matrix.target }}.tar.gz.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: umi-tools-rs-${{ matrix.target }}
          path: umi-tools-rs-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - run: .github/scripts/set-release-version.sh

      - name: Publish the crates not yet on crates.io
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for crate in umi-core umi-tools-rs; do
            if curl -fs -o /dev/null -A "umi-tools-rs release workflow" "https://crates.io/api/v1/crates/$crate/$VERSION"; then
              echo "$crate $VERSION is already published"
            else
              cargo publish --allow-dirty -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
