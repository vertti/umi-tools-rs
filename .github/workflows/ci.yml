name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: "rust uv"
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt clippy
      - run: mise run ci
        env:
          MISE_AUTO_INSTALL: "false"
      - run: mise run duplicates
        env:
          MISE_AUTO_INSTALL: "false"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.98 --profile minimal
      - run: cargo +1.98 build --locked --workspace

  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: CGATOxford/UMI-tools
          ref: 79d8b818676c1e7fb6c5a620e4cb24b372d03eea
          path: umi-tools
      - uses: jdx/mise-action@v5
        with:
          install_args: "rust uv"
      - uses: Swatinem/rust-cache@v2
      - run: mise run compat
        env:
          MISE_AUTO_INSTALL: "false"
          UMI_TOOLS_TESTS_DIR: ${{ github.workspace }}/umi-tools/tests
